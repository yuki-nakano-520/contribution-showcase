name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # 毎日 03:00 JST（18:00 UTC）にデータを更新
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch contribution data
        run: npm run data
        env:
          # 必要なら PAT を SHOWCASE_TOKEN として登録（未登録なら自動発行トークンを使う）
          GITHUB_TOKEN: ${{ secrets.SHOWCASE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ vars.SHOWCASE_USER || github.repository_owner }}

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
